name: delivery-backoffice

x-application: &application
  init: true
  environment: &application-environment
    BACKOFFICE_RUNTIME: docker
    FRONTEND_ORIGIN: http://127.0.0.1:3000
    CREW_FRONTEND_ORIGIN: ${CREW_FRONTEND_ORIGIN:-http://127.0.0.1:3002}
    ROUTE_PUBLICATION_ENABLED: ${ROUTE_PUBLICATION_ENABLED:-false}
    PORT: "3001"
  secrets: &connection-secrets
    - database_url
    - test_database_url
    - odoo_database_url
  volumes:
    - app-data:/app/.local
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-tools: &tools
  <<: *application
  image: delivery-backoffice-tools:0.1.0
  build:
    context: .
    target: tools
  environment:
    <<: *application-environment
    NODE_ENV: development
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    command: ["postgres", "-p", "55432"]
    environment:
      POSTGRES_USER: backoffice_local_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C --auth-host=scram-sha-256
      PGPORT: "55432"
    secrets:
      - admin_password
      - app_password
      - source_owner_password
      - source_reader_password
    ports:
      - "127.0.0.1:55433:55432"
    volumes:
      - pg-data:/var/lib/postgresql
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-backoffice.sh:ro
      - ./docker:/opt/backoffice/docker:ro
      - ./local:/opt/backoffice/local:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "55432", "-U", "backoffice_local_admin", "-d", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  migrate:
    <<: *tools
    command: ["npm", "run", "migrate"]
    restart: "no"

  backend:
    <<: *application
    image: delivery-backoffice-backend:0.1.0
    build:
      context: .
      target: runtime
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      <<: *application-environment
      NODE_ENV: production
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  tools:
    <<: *tools
    profiles: ["tools"]

  tests:
    <<: *tools
    profiles: ["tools"]
    command: ["npm", "test"]
    secrets:
      - database_url
      - test_database_url
      - odoo_database_url
      - source_owner_password

  importer:
    <<: *tools
    profiles: ["importer"]
    command: ["npm", "run", "import:watch"]
    restart: unless-stopped

volumes:
  pg-data:
  app-data:

secrets:
  admin_password:
    file: ./.local/docker/secrets/admin_password
  app_password:
    file: ./.local/docker/secrets/app_password
  source_owner_password:
    file: ./.local/docker/secrets/source_owner_password
  source_reader_password:
    file: ./.local/docker/secrets/source_reader_password
  database_url:
    file: ./.local/docker/secrets/database_url
  test_database_url:
    file: ./.local/docker/secrets/test_database_url
  odoo_database_url:
    file: ./.local/docker/secrets/odoo_database_url
